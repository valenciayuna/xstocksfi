<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nama Kamu | Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
font-family:'Inter',sans-serif;
}

body{

background:#050816;
color:white;
overflow-x:hidden;

}

body::before{

content:"";
position:fixed;
width:700px;
height:700px;
background:radial-gradient(circle,#4f46e555,transparent 70%);
left:-250px;
top:-200px;
z-index:-2;

}

body::after{

content:"";
position:fixed;
width:700px;
height:700px;
background:radial-gradient(circle,#06b6d455,transparent 70%);
right:-250px;
bottom:-200px;
z-index:-2;

}

.progress{

position:fixed;
top:0;
left:0;
height:4px;
width:0%;
background:linear-gradient(90deg,#6366f1,#06b6d4);
z-index:9999;

}

nav{

position:fixed;
top:0;
left:0;
width:100%;
padding:18px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border-bottom:1px solid rgba(255,255,255,.1);
z-index:999;

}

.logo{

font-size:28px;
font-weight:800;
background:linear-gradient(90deg,#6366f1,#06b6d4);
-webkit-background-clip:text;
color:transparent;

}

nav ul{

display:flex;
list-style:none;
gap:30px;

}

nav ul li a{

color:white;
text-decoration:none;
transition:.3s;

}

nav ul li a:hover{

color:#06b6d4;

}

.hero{

min-height:100vh;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
align-items:center;
padding:120px 8%;

}

.hero h3{

font-size:22px;
color:#94a3b8;
margin-bottom:10px;

}

.hero h1{

font-size:60px;
line-height:1.1;
margin-bottom:15px;

}

.typing{

font-size:26px;
font-weight:600;
color:#06b6d4;
margin-bottom:20px;

}

.hero p{

color:#cbd5e1;
line-height:1.8;
max-width:600px;

}

.btns{

margin-top:40px;
display:flex;
gap:20px;
flex-wrap:wrap;

}

.btn{

padding:15px 28px;
border-radius:50px;
text-decoration:none;
font-weight:600;
transition:.4s;

}

.primary{

background:linear-gradient(90deg,#6366f1,#06b6d4);
color:white;

}

.secondary{

border:1px solid #555;
color:white;

}

.btn:hover{

transform:translateY(-5px);

}

.profile{

display:flex;
justify-content:center;

}

.profile img{

width:360px;
height:360px;
border-radius:50%;
object-fit:cover;
border:5px solid rgba(255,255,255,.15);
animation:float 5s ease infinite;

}

@keyframes float{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-18px);

}

}

section{

padding:100px 8%;

}

.title{

font-size:42px;
margin-bottom:50px;
text-align:center;

}

.about{

display:grid;
grid-template-columns:2fr 1fr;
gap:50px;

}

.glass{

background:rgba(255,255,255,.05);
padding:30px;
border-radius:25px;
border:1px solid rgba(255,255,255,.1);
backdrop-filter:blur(20px);

}

.about p{

line-height:1.9;
color:#d1d5db;

}

.info div{

margin:18px 0;

}

.skills{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;

}

.skill{

padding:25px;
border-radius:20px;
background:rgba(255,255,255,.05);

}

.skill h4{

margin-bottom:15px;

}

.bar{

height:10px;
background:#1e293b;
border-radius:20px;
overflow:hidden;

}

.fill{

height:100%;
background:linear-gradient(90deg,#6366f1,#06b6d4);
width:0%;

}

.timeline{

border-left:2px solid #4f46e5;
padding-left:35px;

}

.item{

margin-bottom:50px;
position:relative;

}

.item::before{

content:"";
position:absolute;
width:18px;
height:18px;
background:#06b6d4;
border-radius:50%;
left:-45px;
top:6px;

}

.projects{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:30px;

}

.card{

background:rgba(255,255,255,.05);
border-radius:20px;
overflow:hidden;
transition:.4s;

}

.card:hover{

transform:translateY(-10px);

}

.card img{

width:100%;

}

.card-content{

padding:25px;

}

.contact{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:40px;

}

input,
textarea{

width:100%;
padding:15px;
margin-bottom:15px;
border:none;
border-radius:15px;
background:#111827;
color:white;

}

button{

padding:15px 25px;
border:none;
border-radius:50px;
background:linear-gradient(90deg,#6366f1,#06b6d4);
color:white;
cursor:pointer;

}

.social{

margin-top:20px;
display:flex;
gap:20px;
font-size:28px;

}

.social a{

color:white;
transition:.3s;

}

.social a:hover{

color:#06b6d4;

}

footer{

padding:40px;
text-align:center;
color:#94a3b8;

}

.top{

position:fixed;
bottom:30px;
right:30px;
width:50px;
height:50px;
border-radius:50%;
background:#06b6d4;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
display:none;

}

.reveal{

opacity:0;
transform:translateY(40px);
transition:1s;

}

.reveal.active{

opacity:1;
transform:translateY(0);

}

@media(max-width:900px){

.hero h1{

font-size:45px;

}

.about{

grid-template-columns:1fr;

}

nav ul{

display:none;

}

}

</style>

</head>

<body>

<div class="progress"></div>

<nav>

<div class="logo">MYCV</div>

<ul>

<li><a href="#home">Home</a></li>
<li><a href="#about">About</a></li>
<li><a href="#skills">Skills</a></li>
<li><a href="#experience">Experience</a></li>
<li><a href="#projects">Projects</a></li>
<li><a href="#contact">Contact</a></li>

</ul>

</nav>

<section class="hero" id="home">

<div>

<h3>Hello, I'm</h3>

<h1>Nama Kamu</h1>

<div class="typing"></div>

<p>

Isi deskripsi singkat tentang diri kamu di sini.
Ceritakan siapa kamu, apa passion kamu,
dan apa yang sedang kamu pelajari.

</p>

<div class="btns">

<a href="#" class="btn primary">
Download CV
</a>

<a href="#contact" class="btn secondary">
Hubungi Saya
</a>

</div>

</div>

<div class="profile">

<img src="https://via.placeholder.com/500"
alt="Profile">

</div>

</section>
